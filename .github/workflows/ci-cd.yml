name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Make gradlew executable
        run: chmod +x gradlew
        
      - name: Run tests
        run: ./gradlew test
        
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/
          
  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Make gradlew executable
        run: chmod +x gradlew
        
      - name: Build with Gradle
        run: ./gradlew build
        
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sogileave-jar
          path: build/libs/*.jar
          
  deploy:
    name: Deploy to GitHub
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sogileave-jar
          
      - name: Set up GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh
          
      - name: Create GitHub Release
        run: |
          gh release create v${{ github.run_number }} \
            --title "Release v${{ github.run_number }}" \
            --notes "Automated release from GitHub Actions" \
            Sogileave-*.jar
        env:
          GH_TOKEN: ${{ github.token }}
          
      - name: Prepare Application Deployment
        run: |
          # Create a deployment package with the application and startup scripts
          mkdir -p deployment
          cp build/libs/*.jar deployment/
          cp build/install/Sogileave/bin/* deployment/ || echo "No bin scripts found"
          
          # Create a simple startup script
          cat > deployment/start.sh << 'EOF'
          #!/bin/bash
          java -jar sogileave-*.jar
          EOF
          chmod +x deployment/start.sh
          
          # Create a README for deployment
          cat > deployment/README.md << 'EOF'
          # Sogileave Application Deployment
          
          ## Running the Application
          
          ```bash
          ./start.sh
          ```
          
          ## Running with Custom Port
          
          ```bash
          java -Dio.ktor.deployment.port=8080 -jar sogileave-*.jar
          ```
          
          ## Environment Variables
          
          - `PORT`: Set the server port (default: 8080)
          - `KTOR_ENV`: Set to "development" for development mode
          EOF
          
          # Zip the deployment package
          zip -r sogileave-deployment.zip deployment/
          
      - name: Upload Deployment Package
        uses: actions/upload-artifact@v4
        with:
          name: sogileave-deployment
          path: sogileave-deployment.zip
          
      - name: Verify deployment
        run: |
          echo "Verifying GitHub Release..."
          gh release view v${{ github.run_number }}
          echo "Deployment verification complete!"
        env:
          GH_TOKEN: ${{ github.token }}