name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Make gradlew executable
        run: chmod +x gradlew
        
      - name: Run tests
        run: ./gradlew test
        
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/
          
  build-and-deploy:
    name: Build and Deploy Application
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Make gradlew executable
        run: chmod +x gradlew
        
      - name: Build with Gradle
        run: ./gradlew build
        
      - name: Prepare Application Deployment
        run: |
          # Create a deployment package with the application and startup scripts
          mkdir -p deployment
          cp build/libs/*.jar deployment/
          
          # Create a simple startup script
          cat > deployment/start.sh << 'EOF'
          #!/bin/bash
          java -jar sogileave-*.jar
          EOF
          chmod +x deployment/start.sh
          
          # Create a README for deployment
          cat > deployment/README.md << 'EOF'
          # Sogileave Application Deployment
          
          ## Running the Application
          
          ```bash
          ./start.sh
          ```
          
          ## Running with Custom Port
          
          ```bash
          java -Dio.ktor.deployment.port=8080 -jar sogileave-*.jar
          ```
          
          ## Environment Variables
          
          - `PORT`: Set the server port (default: 8080)
          - `KTOR_ENV`: Set to "development" for development mode
          EOF
          
          # Zip the deployment package
          zip -r sogileave-deployment.zip deployment/
          
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sogileave-jar
          path: build/libs/*.jar
          
      - name: Upload Deployment Package
        uses: actions/upload-artifact@v4
        with:
          name: sogileave-deployment
          path: sogileave-deployment.zip