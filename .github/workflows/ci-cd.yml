name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Make gradlew executable
        run: chmod +x gradlew
        
      - name: Run tests
        run: ./gradlew test
        
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/
          
  build-and-deploy:
    name: Build and Deploy Application
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Make gradlew executable
        run: chmod +x gradlew
        
      - name: Build with Gradle
        run: ./gradlew build
        
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sogileave-jar
          path: build/libs/*.jar
          

          
      - name: Prepare for Render Deployment
        run: |
          # Copy render.yaml to the root for Render detection
          cp render.yaml .
          
          # Create a Render-specific deployment info file
          cat > RENDER_DEPLOYMENT_INFO.md << 'EOF'
          # Render Deployment Information
          
          This repository is configured for automatic deployment to Render.
          
          ## Deployment Configuration
          - **Service Name**: sogileave
          - **Environment**: Java
          - **Build Command**: `./gradlew build`
          - **Start Command**: `java -jar build/libs/*.jar`
          - **Health Check**: `/health`
          - **Auto Deploy**: Enabled (on main branch pushes)
          
          ## Environment Variables
          - `PORT`: 8080 (required by Render)
          - `KTOR_ENV`: production
          
          ## Deployment Process
          1. Push to main branch triggers GitHub Actions
          2. Tests run successfully
          3. Build creates JAR artifact
          4. Render automatically detects changes and deploys
          5. Health checks verify successful deployment
          
          ## Manual Deployment
          If auto-deploy fails, you can manually trigger deployment:
          1. Go to Render dashboard
          2. Select the sogileave service
          3. Click "Manual Deploy" button
          4. Select the latest commit
          
          ## Monitoring
          - **Logs**: Available in Render dashboard
          - **Metrics**: CPU, memory, and response times
          - **Alerts**: Configure in Render settings
          EOF
          
          echo "Render deployment configuration prepared successfully!"